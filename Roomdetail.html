<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hostel | Room Details</title>
    <link rel="stylesheet" href="css/user.css" />
    <link rel="shortcut icon" href="hostel-icon.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script> -->
    <!-- <script src="{% static 'js/validation.js' %}"></script> -->
    <!-- <script src="{% static 'js/entry.js' %}"></script> -->
  </head>
  <body>
    <div class="parent">
      <h2>
        <i
          class="fa-solid fa-circle-arrow-left back"
          onclick="history.back();"
          title="Go Back"
        ></i>
         Room Details Form <input type="button" value="Search" id="search_user">
      </h2>
      <form enctype="multipart/form-data" method="post">
        <table>
          <tr><td>
              <label class="l_move" for="room_no">Room No</label>
              <i class="fa-solid fa-people-roof i1"></i>
              <input
                required
                type="text"
                id="room_no"
                name="room_no"
                
              />
              <span> </span>
            </td>
            <td>
              <select name="" id="room_type">
                <option value="">------ Select Room Type ------</option>
                <option value="ac">ac</option>
                <option value="non ac">non ac</option>
              </select>
              <span></span>
            </td>
            <td>
                <label class="l_move" for="t_bed">Total Bed</label>
                <i class="fa-solid fa-bed i1"></i>
                <input
                  required
                  type="text"
                  name="father_name"
                  id="t_bed"
                />
                <span></span>
              </td>
          </tr>
       

          <tr>
            <td>
                <!-- <label class="l_move" for="status">Status</label> -->
                <select name="" id="status">
                  <option value="">------ Status ------</option>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
                <!-- <span></span> -->
                <span></span>
            </td>
            <td colspan="2">
              <div class="button">
                <button
                  type="submit"
                  value="Submit"
                  style="background-color: rgb(0, 255, 0); color: black"
                  id="room_submit"
                >
                  <i class="fa-solid fa-arrow-up-from-bracket"></i> &nbsp;
                  Submit
                </button>
                <button
                  type="reset"
                  value="Reset"
                  style="background-color: rgb(0, 208, 255); color: black"
                >
                  <i class="fa-solid fa-rotate-left"></i> Reset
                </button>
              </div>
            </td>
          </tr>
        </table>
      </form>
    </div>
  </body>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
<script src="scripts/roomdetails.js"></script>
</html>
